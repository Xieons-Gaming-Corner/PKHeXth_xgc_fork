name: Build and Release PKHeX

on:
  push:
    branches:
      - main
      - master
    paths:
      - Directory.Build.props
      - PKHeX.WinForms/MainWindow/Plugins/**
      - PKHeX.Core/Resources/legality/**
      - wild/**

  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes (optional)
        required: false
        default: ""
        type: string

permissions:
  contents: write

# Serialize release runs so two jobs do not select the same revision.
concurrency:
  group: pkhex-release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read project version
        id: version
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "Directory.Build.props")) {
            throw "Directory.Build.props was not found."
          }

          [xml]$props = Get-Content "Directory.Build.props" -Raw
          $node = $props.SelectSingleNode("/Project/PropertyGroup/Version")

          if ($null -eq $node) {
            throw "No Version element was found in Directory.Build.props."
          }

          $version = $node.InnerText.Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a three-part version such as 26.10.18; found '$version'."
          }

          "BASE_VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Project version: $version"

      - name: Determine release version
        id: release
        env:
          BASE_VERSION: ${{ steps.version.outputs.BASE_VERSION }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $baseVersion = $env:BASE_VERSION

          if ([string]::IsNullOrWhiteSpace($baseVersion)) {
            throw "BASE_VERSION is empty."
          }

          # Fetch every release page.
          $releaseJson = gh api --paginate --slurp `
            "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list repository releases."
          }

          $pages = ConvertFrom-Json -InputObject ($releaseJson -join "`n")

          $releaseTags = @(
            foreach ($page in $pages) {
              foreach ($release in $page) {
                if ($release.tag_name) {
                  [string]$release.tag_name
                }
              }
            }
          )

          # List all remote tags. An empty result is valid;
          # authentication or network failures still stop the workflow.
          $remoteTagLines = @(git ls-remote --tags --refs origin)

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list remote Git tags."
          }

          $remoteTags = @(
            foreach ($line in $remoteTagLines) {
              if ($line -match '\srefs/tags/(.+)$') {
                [string]$Matches[1]
              }
            }
          )

          # Include release records and Git tags when choosing a revision.
          $allTags = @($releaseTags) + @($remoteTags)

          $baseExists = (
            $allTags -contains $baseVersion -or
            $allTags -contains "v$baseVersion"
          )

          $latestRevision = 0
          $pattern = "^v?$([regex]::Escape($baseVersion))-rev\.(\d+)$"

          foreach ($tag in $allTags) {
            if ($tag -match $pattern) {
              $latestRevision = [Math]::Max(
                $latestRevision,
                [int]$Matches[1]
              )
            }
          }

          if ($baseExists -or $latestRevision -gt 0) {
            $revision = $latestRevision + 1
            $releaseVersion = "${baseVersion}-rev.${revision}"
          } else {
            $revision = 0
            $releaseVersion = $baseVersion
          }

          $buildVersion = "${baseVersion}.${revision}"

          "RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_OUTPUT
          "BUILD_VERSION=$buildVersion" >> $env:GITHUB_OUTPUT

          Write-Host "Release tag: $releaseVersion"
          Write-Host "Assembly version: $buildVersion"

          exit 0

      - name: Restore dependencies
        run: |
          dotnet restore PKHeX.sln

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency restore failed."
          }

      - name: Publish Windows application
        env:
          BUILD_VERSION: ${{ steps.release.outputs.BUILD_VERSION }}
        run: |
          $ErrorActionPreference = "Stop"

          dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            "-p:PublishSingleFile=true" `
            "-p:PublishReadyToRun=true" `
            "-p:IncludeAllContentForSelfExtract=true" `
            "-p:Version=$env:BUILD_VERSION" `
            --output publish

          if ($LASTEXITCODE -ne 0) {
            throw "Application publish failed."
          }

      - name: Prepare release assets
        run: |
          $ErrorActionPreference = "Stop"

          $exePath = "publish/PKHeX.exe"

          if (-not (Test-Path $exePath)) {
            throw "Required release asset was not found: $exePath"
          }

          # Prefer the paths used by the existing workflow.
          $coreCandidates = @(
            "publish/PKHeX.Core.dll",
            "PKHeX.Core/bin/Release/net10.0/PKHeX.Core.dll",
            "PKHeX.Core/bin/Release/net10.0/win-x64/PKHeX.Core.dll"
          )

          $corePath = $coreCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $corePath) {
            $fallback = Get-ChildItem `
              -Path "PKHeX.Core/bin/Release" `
              -Filter "PKHeX.Core.dll" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '[\\/](ref|refint)[\\/]'
              } |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 1

            if ($fallback) {
              $corePath = $fallback.FullName
            }
          }

          if (-not $corePath) {
            throw "Required release asset PKHeX.Core.dll was not found."
          }

          New-Item -ItemType Directory -Path release-assets -Force |
            Out-Null

          Copy-Item $exePath "release-assets/PKHeX.exe" -Force
          Copy-Item $corePath "release-assets/PKHeX.Core.dll" -Force

          Get-ChildItem "release-assets" |
            Format-Table Name, Length

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.RELEASE_VERSION }}
          CUSTOM_NOTES: ${{ inputs.release_notes }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:RELEASE_VERSION

          if (-not [string]::IsNullOrWhiteSpace($env:CUSTOM_NOTES)) {
            $notes = $env:CUSTOM_NOTES
          } else {
            $trigger = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
              "Manual release build."
            } else {
              "Automatic release for version, plugin, or legality-resource changes."
            }

            $lines = @(
              "## Release v$version",
              "",
              "- Updated PKHeX.exe",
              "- Updated PKHeX.Core.dll",
              "",
              $trigger,
              "",
              "Built from commit: $env:GITHUB_SHA"
            )

            $notes = $lines -join "`n"
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"

          Set-Content `
            -Path $notesPath `
            -Value $notes `
            -Encoding utf8

      - name: Create release tag at the built commit
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.RELEASE_VERSION }}
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email `
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$env:RELEASE_VERSION" "$env:GITHUB_SHA"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create tag '$env:RELEASE_VERSION'."
          }

          git push origin "refs/tags/$env:RELEASE_VERSION"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to push tag '$env:RELEASE_VERSION'."
          }

      - name: Create draft release with assets
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.RELEASE_VERSION }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:RELEASE_VERSION
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"

          $title = if ($version -like "*-rev.*") {
            "v$version - Revision Update"
          } else {
            "v$version"
          }

          gh release create "$version" `
            "release-assets/PKHeX.exe" `
            "release-assets/PKHeX.Core.dll" `
            --verify-tag `
            --draft `
            --title "$title" `
            --notes-file "$notesPath"

          if ($LASTEXITCODE -ne 0) {
            throw "Release creation or asset upload failed for '$version'."
          }

      - name: Verify assets and publish release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.RELEASE_VERSION }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:RELEASE_VERSION

          $releaseJson = gh release view "$version" --json assets

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read the draft release '$version'."
          }

          $release = ConvertFrom-Json `
            -InputObject ($releaseJson -join "`n")

          foreach ($required in @("PKHeX.exe", "PKHeX.Core.dll")) {
            $asset = $release.assets |
              Where-Object {
                $_.name -eq $required -and $_.size -gt 0
              } |
              Select-Object -First 1

            if (-not $asset) {
              throw "Release asset '$required' is missing or empty. Release remains a draft."
            }
          }

          gh release edit "$version" --draft=false --latest

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release '$version'."
          }

          $url = gh release view "$version" --json url --jq ".url"

          if ($LASTEXITCODE -ne 0) {
            throw "Release published, but reading its URL failed."
          }

          "## Published release" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "$url" >> $env:GITHUB_STEP_SUMMARY

          Write-Host "Published release: $url"
